# Conda environment for the SETIA human application (BMMC + GTEx notebooks).
# Independent of the yeast SETIA env; create with:
#   conda env create -f environment.yml && conda activate setia-human
name: setia-human
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - numpy=1.26
  - pandas=2.2
  - scipy
  - statsmodels
  - scikit-learn
  - anndata
  - matplotlib
  - mpld3
  - requests
  - kneed
  - openpyxl
  - jupyterlab
  - pip
  - pip:
      - MOODS-python        # motif scanning (import MOODS.scan / MOODS.tools)
# External command-line tools (not pip/conda-installable here; install separately):
#   - HOMER         motif scan in build_chip_prior (manuscript Methods)
#   - bedtools      interval ops (if used by build_chip_prior)
#   - UCSC hg38 genome FASTA is downloaded by build_chip_prior at run time
